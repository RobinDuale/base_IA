# Sonde exterieure du VPS srv1161197.hstgr.cloud
#
# Pourquoi elle existe : tout le dispositif de surveillance du VPS tourne sur le
# VPS lui-meme. Si la machine s arrete, n8n s arrete avec elle et aucun mail ne
# part. Une sonde qui vit ailleurs est le seul moyen de couvrir ce cas.
#
# Pourquoi dans ce depot : les minutes GitHub Actions sont illimitees sur un
# depot public et plafonnees a 2000 par mois sur un depot prive, ce qu une
# cadence de 15 minutes depasserait. Ce depot porte deja le deploiement vers
# ce VPS, la sonde y est donc coherente.
#
# Comment l alerte arrive : un job en echec declenche la notification GitHub,
# qui envoie un mail au proprietaire du depot. Aucun service tiers, aucun
# compte a creer, aucun secret a deposer.
#
# Pourquoi deux passes sur deux runners distincts, revu le 2026-08-17 :
#
#   Une premiere version alertait des la premiere passe. Le 2026-08-16 a 04h05
#   UTC les trois hotes ont echoue ensemble alors que la machine tournait
#   depuis deux jours. Une seconde passe a ete ajoutee dans le meme job, huit
#   minutes plus tard, pour ecarter le hoquet de routage.
#
#   Cette seconde passe n a rien ecarte du tout. Trois nouvelles alertes ont
#   suivi en trente heures, 16/08 07h16, 16/08 17h51 et 17/08 06h07, et les
#   deux passes ont echoue a l identique les trois fois. Diagnostic du
#   2026-08-17 sur la machine : charge a 98 pour cent d inactivite, trafic
#   entrant nominal, aucune erreur d interface, aucun paquet rejete, fail2ban a
#   zero banni, pare-feu Hostinger en accept any sur 80 et 443, et Authelia qui
#   servait des requetes pendant la fenetre exacte de l echec. Le VPS etait
#   debout et joignable a chaque fois.
#
#   La cause est ailleurs. Deux passes dans le meme job tournent sur la meme
#   machine virtuelle, donc derriere la meme adresse de sortie et le meme
#   chemin reseau. Un chemin bloque le reste pour toute la duree du run, et
#   attendre huit minutes ne le change pas. C est ce que les faits disaient :
#   quatre echecs sur cinquante-sept passages, chaque fois integralement, et un
#   autre runner joignait la machine vingt minutes plus tard.
#
#   La seconde passe tourne donc maintenant dans un job separe. GitHub lui
#   attribue une machine virtuelle neuve, donc une autre adresse de sortie et
#   un autre chemin. La sonde teste ainsi deux chemins independants au lieu de
#   sonder deux fois le meme, et n alerte que si les deux echouent. Le temps de
#   detection tombe de quinze minutes a environ trois.
#
# Piege a connaitre : GitHub desactive les planifications d un depot public
# reste sans activite pendant 60 jours. Ce depot recoit des deploiements
# reguliers, mais si la sonde cessait de tourner, elle cesserait en silence.
# Le rapport hebdomadaire de l agent admin VPS ne le verrait pas non plus.
#
# Projet : Agent admin systeme VPS, second cerveau de Robin Duale.

name: Sonde exterieure VPS

on:
  schedule:
    # Toutes les 15 minutes. GitHub decale les executions planifiees selon sa
    # charge, la cadence reelle observee oscille entre 15 et 40 minutes.
    # Suffisant pour detecter une machine morte, l objectif n etant pas la
    # seconde pres.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Premiere passe. Ne fait jamais echouer le run a elle seule : son role est
  # de dire si une seconde vue vaut la peine d etre demandee.
  premier-chemin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      verdict: ${{ steps.controle.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - name: Interroger le VPS depuis ce runner
        id: controle
        run: |
          if bash .github/scripts/sonde-vps.sh; then
            echo "verdict=repond" >> "$GITHUB_OUTPUT"
            echo
            echo "Les trois services repondent, le VPS est joignable."
          else
            echo "verdict=muet" >> "$GITHUB_OUTPUT"
            echo
            echo "Au moins un service est muet depuis ce runner. Un second"
            echo "runner va verifier par un autre chemin avant de conclure."
          fi

  # Seconde passe, sur un runner neuf. C est ce changement de machine qui
  # distingue une panne du VPS d un chemin reseau bloque, le premier cas
  # echouant partout et le second seulement ici.
  second-chemin:
    needs: premier-chemin
    if: needs.premier-chemin.outputs.verdict == 'muet'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Confirmer depuis un autre runner
        run: |
          # L attribution d un runner neuf prend deja une trentaine de
          # secondes. Ce delai porte la separation dans le temps a environ une
          # minute et demie, de quoi laisser passer un redemarrage de
          # conteneur, sans ramener le run a quinze minutes.
          sleep 60

          if bash .github/scripts/sonde-vps.sh; then
            echo "::warning::Chemin reseau bloque, pas une panne du VPS : un runner ne joignait aucun des trois hotes, un second les joint tous. Aucune alerte envoyee."
            echo
            echo "Les trois services repondent depuis ce second runner. Le"
            echo "premier n avait donc pas affaire a une machine tombee. La"
            echo "trace reste dans l historique des runs, et les deux adresses"
            echo "de sortie journalisees permettent de recouper les cas si le"
            echo "phenomene se repete."
            exit 0
          fi

          echo
          echo "Deux runners distincts, deux chemins reseau distincts, aucun ne"
          echo "joint le VPS. Ce n est plus un probleme de routage."
          echo "Causes possibles : machine arretee, Traefik casse, certificat"
          echo "expire, ou pare-feu Hostinger modifie."
          exit 1
